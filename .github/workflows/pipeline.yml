name: Progress Tracker CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: progress_tracker_test
          POSTGRES_USER: progress_tracker
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U progress_tracker -d progress_tracker_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-only-key-not-for-deployment
      POSTGRES_DB: progress_tracker_test
      POSTGRES_USER: progress_tracker
      POSTGRES_PASSWORD: ci-only-database-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --noinput
  

  container:
    name: Build and verify production image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t progress-tracker:ci .

      - name: Verify non-root user
        run: |
          test "$(docker run --rm progress-tracker:ci id -u)" != "0"

      - name: Start PostgreSQL
        run: |
          docker network create progress-tracker-ci

          docker run -d \
            --name db \
            --network progress-tracker-ci \
            -e POSTGRES_DB=progress_tracker \
            -e POSTGRES_USER=progress_tracker \
            -e POSTGRES_PASSWORD=ci-only-database-password \
            --health-cmd="pg_isready -U progress_tracker -d progress_tracker" \
            --health-interval=2s \
            --health-timeout=5s \
            --health-retries=30 \
            postgres:17-bookworm

          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' db)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          docker logs db
          exit 1

      - name: Start application
        run: |
          docker run -d \
            --name web \
            --network progress-tracker-ci \
            -p 127.0.0.1:8080:8000 \
            -e DJANGO_SECRET_KEY=ci-only-key-not-for-deployment \
            -e DJANGO_DEBUG=false \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e POSTGRES_DB=progress_tracker \
            -e POSTGRES_USER=progress_tracker \
            -e POSTGRES_PASSWORD=ci-only-database-password \
            -e POSTGRES_HOST=db \
            -e POSTGRES_PORT=5432 \
            progress-tracker:ci \
            /bin/sh -c \
            'python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --access-logfile - --error-logfile -'

      - name: Verify application and static files
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 --output /dev/null \
              http://127.0.0.1:8080/health/ready/; then
              break
            fi
            sleep 2
          done

          for endpoint in \
            /health/live/ \
            /health/ready/ \
            /admin/login/ \
            /static/tracking/styles.css; do
            curl --fail --show-error --silent --max-time 5 \
              --output /dev/null \
              "http://127.0.0.1:8080${endpoint}"
          done

      - name: Verify behavior during database outage
        run: |
          docker stop db

          curl --fail --show-error --silent --max-time 5 \
            --output /dev/null \
            http://127.0.0.1:8080/health/live/

          status=$(curl --show-error --silent --max-time 10 \
            --output /tmp/readiness.json \
            --write-out "%{http_code}" \
            http://127.0.0.1:8080/health/ready/)

          test "$status" = "503"

          python3 -c 'import json; assert json.load(open("/tmp/readiness.json")) == {"status": "not_ready"}'

      - name: Verify recovery after database restart
        run: |
          docker start db

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 --output /dev/null \
              http://127.0.0.1:8080/health/ready/; then
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become ready after database restart."
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs db || true
          docker logs web || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f web db || true
          docker network rm progress-tracker-ci || true

  publish:
    name: Publish image to Amazon ECR
    runs-on: ubuntu-latest
    needs: [test, container]

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Authenticate to AWS through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: progress-tracker-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Build and publish image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          printf '### Published image\n\n`%s`\n' "$IMAGE_URI" \
            >> "$GITHUB_STEP_SUMMARY"