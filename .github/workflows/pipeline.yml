name: Progress Tracker CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy an existing image to EC2"
        type: boolean
        required: true
        default: false

      instance_id:
        description: "Target EC2 instance ID"
        type: string
        required: false

      image_uri:
        description: "Full ECR image URI ending in @sha256:..."
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: progress_tracker_test
          POSTGRES_USER: progress_tracker
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U progress_tracker -d progress_tracker_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-only-key-not-for-deployment
      POSTGRES_DB: progress_tracker_test
      POSTGRES_USER: progress_tracker
      POSTGRES_PASSWORD: ci-only-database-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --noinput

  container:
    name: Build and verify production image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production container
        run: bash ci/test-container.sh
  publish:
    name: Publish image to Amazon ECR
    runs-on: ubuntu-latest
    needs: [test, container]

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.deploy))

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Authenticate to AWS through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: progress-tracker-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Build and publish image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          printf '### Published image\n\n`%s`\n' "$IMAGE_URI" \
            >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy application through Systems Manager
    runs-on: ubuntu-latest
    needs: [test, container]

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy

    timeout-minutes: 20

    concurrency:
      group: progress-tracker-aws-deploy
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ inputs.instance_id }}
      IMAGE_URI: ${{ inputs.image_uri }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Prepare deployment command
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import shlex
          from pathlib import Path

          instance_id = os.environ["INSTANCE_ID"]
          image_uri = os.environ["IMAGE_URI"]

          if not re.fullmatch(r"i-[0-9a-f]{17}", instance_id):
              raise SystemExit("Enter a valid EC2 instance ID.")

          image_pattern = (
              r"[0-9]{12}\.dkr\.ecr\.us-east-1\.amazonaws\.com/"
              r"progress-tracker@sha256:[0-9a-f]{64}"
          )

          if not re.fullmatch(image_pattern, image_uri):
              raise SystemExit(
                  "Enter a valid Progress Tracker ECR image digest."
              )

          commands = [
              "set -eu",
              "cloud-init status --wait",
              "install -d -m 0750 /opt/progress-tracker",
          ]

          for filename in ("compose.yml", "deploy.sh"):
              source = Path("deployment") / filename
              encoded = base64.b64encode(
                  source.read_bytes()
              ).decode("ascii")

              destination = f"/opt/progress-tracker/{filename}"

              commands.append(
                  f"printf '%s' {shlex.quote(encoded)} "
                  f"| base64 --decode > {shlex.quote(destination)}"
              )

          commands.extend([
              "chmod 0640 /opt/progress-tracker/compose.yml",
              "chmod 0750 /opt/progress-tracker/deploy.sh",
              (
                  "/bin/bash /opt/progress-tracker/deploy.sh "
                  + shlex.quote(image_uri)
              ),
          ])

          payload = {
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": [instance_id],
              "Comment": "Deploy Progress Tracker from GitHub Actions",
              "Parameters": {
                  "commands": ["\n".join(commands)],
                  "executionTimeout": ["900"],
              },
          }

          Path("ssm-command.json").write_text(
              json.dumps(payload)
          )
          PY

      - name: Authenticate to AWS through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: progress-tracker-deploy-${{ github.run_id }}

      - name: Send deployment command
        id: send
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm-command.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          for attempt in $(seq 1 180); do
            if STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text \
              2> invocation-error.log); then

              echo "Deployment status: $STATUS"

              case "$STATUS" in
                Success)
                  exit 0
                  ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  exit 1
                  ;;
              esac
            else
              if ! grep -q "InvocationDoesNotExist" invocation-error.log; then
                cat invocation-error.log
                exit 1
              fi
            fi

            sleep 5
          done

          echo "Timed out waiting for deployment."
          exit 1

      - name: Show deployment output
        if: always() && steps.send.outputs.command_id != ''
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'