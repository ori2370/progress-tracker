name: progress-tracker-backup-ci

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: backup_source
      POSTGRES_USER: backup_test
      POSTGRES_PASSWORD: ci-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup_test -d backup_source"]
      interval: 2s
      timeout: 5s
      retries: 30